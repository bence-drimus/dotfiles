# Neutral dark grey (macOS Terminal style) with Gruvbox colours, used while the system is in light mode

[colors.primary]
background = "#2d2d2d"
foreground = "#e4e4e4"

[colors.cursor]
cursor = "#fe8019"
text = "#2d2d2d"

[colors.selection]
background = "#d65d0e"
text = "#282828"

[colors.normal]
black = "#2d2d2d"
red = "#cc241d"
green = "#98971a"
yellow = "#d79921"
blue = "#458588"
magenta = "#b16286"
cyan = "#689d6a"
white = "#a89984"

[colors.bright]
black = "#928374"
red = "#fb4934"
green = "#b8bb26"
yellow = "#fabd2f"
blue = "#83a598"
magenta = "#d3869b"
cyan = "#8ec07c"
white = "#ebdbb2"

# Gruvbox dark, same as theme/colours-dark.css (background at 85% like wofi)

[global]
    frame_color = "#ebdbb226"
    highlight = "#d65d0e"
    icon_theme = "WhiteSur-dark"

[urgency_low]
    background = "#282828d9"
    foreground = "#a89984"

[urgency_normal]
    background = "#282828d9"
    foreground = "#ebdbb2"

[urgency_critical]
    background = "#282828d9"
    foreground = "#ebdbb2"
    frame_color = "#d65d0e"

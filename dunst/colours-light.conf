# Neutral light, same as theme/colours-light.css (background at 85% like wofi)

[global]
    frame_color = "#32323626"
    highlight = "#d65d0e"
    icon_theme = "WhiteSur-light"

[urgency_low]
    background = "#fafafad9"
    foreground = "#77767b"

[urgency_normal]
    background = "#fafafad9"
    foreground = "#323236"

[urgency_critical]
    background = "#fafafad9"
    foreground = "#323236"
    frame_color = "#d65d0e"

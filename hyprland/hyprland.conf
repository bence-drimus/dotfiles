# #######################################################################################
# HYPRLAND CONFIG - Migrated from i3
# #######################################################################################

################
### MONITORS ###
################

monitor = , preferred, auto, 1


###################
### MY PROGRAMS ###
###################

$terminal = alacritty
$fileManager = dolphin
$menu = fuzzel  # or use dmenu/rofi if you prefer

#################
### AUTOSTART ###
#################

exec-once = systemctl --user start hyprpolkitagent
exec-once = waybar & hyprpaper
exec-once = blueman-applet
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = dbus-update-activation-environment --systemd --all
exec-once = hyprpm reload -n

# Redshift equivalent for Wayland (adjust coordinates for your location)
exec-once = wlsunset -l 51.50 -L 0.1 -t 2000 -T 5500

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = SSH_AUTH_SOCK,$XDG_RUNTIME_DIR/keyring/ssh
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland


#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 5
    gaps_out = 20
    border_size = 2

    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    resize_on_border = false
    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding = 10

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

animations {
    enabled = yes

    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear, 0, 0, 1, 1
    bezier = almostLinear, 0.5, 0.5, 0.75, 1
    bezier = quick, 0.15, 0, 0.1, 1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = false
}


#############
### INPUT ###
#############

input {
    # Multiple keyboard layouts with CapsLock as Super
    # IMPORTANT: The order matters - set layouts first, then options
    kb_layout = us,gb,ru
    kb_variant = ,,phonetic_mac
    kb_options = grp:alt_shift_toggle,caps:super
    
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = false
        scroll_factor = 0.2
    }
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# Main modifier - CapsLock (remapped to Super via kb_options)
$mainMod = SUPER

# Key variables for easy customization
$up = k
$down = j
$left = h
$right = l

# Program launch
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, D, exec, $menu
bind = $mainMod, E, exec, $fileManager

# Window management
bind = $mainMod SHIFT, Q, killactive,
bind = $mainMod, Q, killactive,  # Keep your preference
bind = $mainMod, W, killactive,  # Alternative
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, V, togglefloating,
bind = $mainMod SHIFT, SPACE, togglefloating,
bind = $mainMod, SPACE, togglefloating,  # Alternative
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, P, pseudo,  # dwindle pseudotile
bind = $mainMod, J, togglesplit,  # dwindle toggle split

# Layout modes (similar to i3)
bind = $mainMod, S, exec, hyprctl keyword general:layout master  # Stacking-like
bind = $mainMod SHIFT, W, exec, hyprctl keyword general:layout dwindle  # Tabbed-like
# bind = $mainMod, E, layout toggle split  # Toggle split (conflicts with file manager)

# Focus management
bind = $mainMod, $left, movefocus, l
bind = $mainMod, $down, movefocus, d
bind = $mainMod, $up, movefocus, u
bind = $mainMod, $right, movefocus, r

# Arrow key alternatives
bind = $mainMod, left, movefocus, l
bind = $mainMod, down, movefocus, d
bind = $mainMod, up, movefocus, u
bind = $mainMod, right, movefocus, r

# Move windows (like i3's move)
bind = $mainMod SHIFT, $left, movewindow, l
bind = $mainMod SHIFT, $down, movewindow, d
bind = $mainMod SHIFT, $up, movewindow, u
bind = $mainMod SHIFT, $right, movewindow, r

# Arrow key alternatives
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, right, movewindow, r

# Move workspace between monitors (like i3)
bind = $mainMod CTRL, $left, movecurrentworkspacetomonitor, l
bind = $mainMod CTRL, $down, movecurrentworkspacetomonitor, d
bind = $mainMod CTRL, $up, movecurrentworkspacetomonitor, u
bind = $mainMod CTRL, $right, movecurrentworkspacetomonitor, r

# Arrow key alternatives
bind = $mainMod CTRL, left, movecurrentworkspacetomonitor, l
bind = $mainMod CTRL, down, movecurrentworkspacetomonitor, d
bind = $mainMod CTRL, up, movecurrentworkspacetomonitor, u
bind = $mainMod CTRL, right, movecurrentworkspacetomonitor, r

# Parent/child focus (i3-style)
# bind = $mainMod, A, focusparent,  # Not available in Hyprland
# Note: Hyprland doesn't have focuschild equivalent

# Scratchpad (like i3)
bind = $mainMod SHIFT, minus, movetoworkspace, special:magic
bind = $mainMod, minus, togglespecialworkspace, magic

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move windows to workspaces
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Reload/restart (i3-style)
bind = $mainMod SHIFT, C, exec, hyprctl reload
bind = $mainMod SHIFT, R, exec, hyprctl reload

# Resize mode (i3-style)
bind = $mainMod, R, submap, resize

submap = resize
binde = $left, resizeactive, -10 0
binde = $down, resizeactive, 0 10
binde = $up, resizeactive, 0 -10
binde = $right, resizeactive, 10 0

binde = left, resizeactive, -10 0
binde = down, resizeactive, 0 10
binde = up, resizeactive, 0 -10
binde = right, resizeactive, 10 0

bind = , RETURN, submap, reset
bind = , ESCAPE, submap, reset
bind = $mainMod, R, submap, reset
submap = reset

# Mouse bindings
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Multimedia keys
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Media controls
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous


##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

windowrule {
    name = move-hyprland-run
    match:class = hyprland-run
    move = 20 monitor_h-120
    float = yes
}


##############################
### HY3 PLUGIN (OPTIONAL) ###
##############################

# If you have hy3 installed, uncomment these:
plugin {
    hy3 {
        no_gaps_when_only = 1
        node_collapse_policy = 2
        group_inset = 10
        tabs {
            height = 15
            padding = 5
            render_text = true
        }
    }
}

# Hy3-specific bindings (uncomment if using hy3):
bind = $mainMod, S, hy3:makegroup, tab
bind = $mainMod, W, hy3:makegroup, opposite
bind = $mainMod, E, hy3:expand, expand
bind = $mainMod SHIFT, E, hy3:expand, base
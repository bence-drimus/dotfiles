# Colours follow darkman, see darkman/theme
source = ~/.config/hypr/hyprlock-colours.conf
$font = Adwaita Sans

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

# plain colour, same as the desktop background in hyprland.lua
background {
    monitor =
    color = $bg
}

label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = $font
    color = $fg
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A %-d %B"
    font_size = 20
    font_family = $font
    color = $fg_dim
    position = 0, 60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    rounding = 12
    inner_color = $surface
    outer_color = $border
    check_color = $accent
    fail_color = $red
    font_color = $fg
    font_family = $font
    fade_on_empty = false
    placeholder_text = Password
    fail_text = $PAMFAIL
    dots_spacing = 0.3
    position = 0, -40
    halign = center
    valign = center
}
